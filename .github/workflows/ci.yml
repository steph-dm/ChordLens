name: ChordLens checks
on:
  push:
    paths-ignore: ['ChordFlow/**']
  pull_request:
    paths-ignore: ['ChordFlow/**']
permissions:
  contents: read
jobs:
  library:
    strategy:
      matrix:
        node: ['22.0.0', 24]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Node 22.0.0's npm.ps1 can resolve npm to a nonexistent global prefix.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/ChordFlow/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/ChordFlow/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
